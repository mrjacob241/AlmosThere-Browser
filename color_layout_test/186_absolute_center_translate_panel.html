<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>186 Absolute Center Translate Panel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #263238;
    }
    .stage {
      position: relative;
      width: 760px;
      height: 360px;
      background: #2f6b4f;
      overflow: hidden;
    }
    .center-panel {
      position: absolute;
      left: 50%;
      top: 132px;
      transform: translateX(-50%);
      width: 360px;
      min-height: 96px;
      padding: 16px;
      border: 2px solid #ffffff;
      border-radius: 10px;
      background: #405c58;
      color: #ffffff;
    }
    .row {
      height: 28px;
      margin-bottom: 10px;
      background: #f2d66b;
    }
    .row:last-child {
      margin-bottom: 0;
      background: #9dd8c8;
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="center-panel">
      <div class="row"></div>
      <div class="row"></div>
    </section>
  </main>
</body>
</html>
