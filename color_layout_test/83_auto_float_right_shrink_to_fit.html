<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>83 - Auto Float Right Shrink To Fit</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f7f8fa; font-family: system-ui, sans-serif; }
.article { width: 760px; border: 1px solid rgba(20,30,40,.18); padding: 16px; background: #fff; }
.float { float: right; margin: 0 0 12px 18px; padding: 10px; background: #ffd43b; border: 1px solid rgba(20,30,40,.18); }
.chip { display: inline-block; width: 160px; height: 120px; background: #4dabf7; }
p { margin: 0 0 14px; min-height: 76px; background: #b2f2bb; padding: 10px; }
.label { position: fixed; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); border: 1px solid rgba(20,30,40,.18); padding: 6px 8px; font-size: 12px; }
</style>
</head>
<body>
<article class="article"><aside class="float"><span class="chip"></span></aside><p>Text should keep a readable width beside an auto-width right float.</p><p>The float should shrink to the blue chip instead of occupying the entire article.</p></article>
<div class="label">83 / 85 - Auto Float Right Shrink To Fit</div>
</body>
</html>
