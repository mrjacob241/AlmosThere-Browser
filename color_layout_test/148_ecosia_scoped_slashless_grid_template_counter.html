<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>148 Ecosia Scoped Slashless Grid Template Counter</title>
<style>
html, body { margin: 0; padding: 0; background: #f5f7fa; font-family: Arial, sans-serif; }
.hero { position: relative; min-height: 520px; background: #d7eb80; margin: 8px; border-radius: 20px; }
.counter-wrapper { position: absolute; left: 140px; bottom: 48px; display: flex; align-items: center; }
.global-counter { display: grid; grid-template-columns: auto 1px auto; overflow: hidden; border: 1px solid #ffffff; border-radius: 10px; background: #365e57; }
.global-counter__item { display: inline; min-width: 0; color: #ffffff; text-decoration: none; }
.counter[data-v-test] {
  display: grid;
  grid-template:
    "image count"
    "image description";
  grid-template-columns: max-content;
  min-height: 69px;
  padding: 16px;
  background: #729b91;
}
.counter__image[data-v-test] { grid-area: image; width: 40px; height: 40px; background: #f49f3f; align-self: center; }
.counter__count[data-v-test] { grid-area: count; display: flex; align-items: center; font-size: 20px; font-weight: 700; background: #5c7edb; }
.counter__description[data-v-test] { grid-area: description; display: block; font-size: 14px; background: #f6df73; }
.global-counter__divider { width: 1px; margin: 16px 0; background: #ffffff; }
</style>
</head>
<body>
<section class="hero">
  <div class="counter-wrapper">
    <div class="global-counter">
      <a class="global-counter__item" href="#">
        <div class="counter" data-v-test>
          <div class="counter__image" data-v-test></div>
          <div class="counter__count" data-v-test>251,792,100</div>
          <div class="counter__description" data-v-test>trees planted by Ecosia</div>
        </div>
      </a>
      <div class="global-counter__divider"></div>
      <a class="global-counter__item" href="#">
        <div class="counter" data-v-test>
          <div class="counter__image" data-v-test></div>
          <div class="counter__count" data-v-test>€101,719,760</div>
          <div class="counter__description" data-v-test>dedicated to climate action</div>
        </div>
      </a>
    </div>
  </div>
</section>
</body>
</html>
