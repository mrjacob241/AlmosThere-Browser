<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>35 - reference article Article Mobile</title>
<style>

:root {
  --ink: #17212b;
  --muted: #5c6670;
  --page: #f7f8fa;
  --line: rgba(20, 30, 40, 0.18);
  --red: #ff6b6b;
  --orange: #f59f00;
  --yellow: #ffd43b;
  --green: #51cf66;
  --teal: #20c997;
  --cyan: #22b8cf;
  --blue: #4dabf7;
  --indigo: #748ffc;
  --violet: #9775fa;
  --pink: #f783ac;
  --gray: #ced4da;
  --dark: #495057;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--page);
}
.box {
  min-height: 48px;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  padding: 10px;
  font-size: 13px;
  font-weight: 700;
  color: rgba(0,0,0,0.74);
  text-align: center;
}
.tall { min-height: 160px; }
.xtall { min-height: 300px; }
.label {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 20;
  padding: 6px 8px;
  background: rgba(255,255,255,0.88);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}


.page { max-width: 760px; margin: 0 auto; min-height: 100vh; display: grid; grid-template-rows: 56px auto 1fr auto; background: white; }
header { background: var(--blue); display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; padding: 8px; }
.title { background: var(--yellow); min-height: 88px; }
main { display: grid; gap: 12px; padding: 14px; }
.para { background: var(--green); min-height: 120px; } .image { background: var(--pink); min-height: 180px; }
footer { background: var(--gray); min-height: 80px; }

</style>
</head>
<body>
<div class="page"><header><div class="box">menu</div><div class="box">mobile header</div><div class="box">more</div></header><section class="box title">article title</section><main><section class="box image">lead image</section><section class="box para">section 1</section><section class="box para">section 2</section><section class="box para">section 3</section><section class="box para">section 4</section><section class="box para">section 5</section></main><footer class="box">footer</footer></div>
<div class="label">35 / 50 - reference article Article Mobile</div>
</body>
</html>
