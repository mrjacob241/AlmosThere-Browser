<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>119 - reference article Nested Link Children</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 28px; background: #f8f9fa; color: #202122; font: 16px/1.55 Georgia, "Times New Roman", serif; }
.page { width: 940px; margin: 0 auto; padding: 28px 34px; background: #fff; border: 1px solid #a2a9b1; }
.line { background: #d8f5a2; padding: 12px 14px; margin: 0 0 12px; }
a { color: #0645ad; background: #91a7ff; text-decoration: underline; padding: 0; margin: 0; }
a span { background: #b197fc; }
i, b { background: #63e6be; }
.after { background: #ffd43b; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.9); border: 1px solid #a2a9b1; font: 12px/1.2 system-ui, sans-serif; }
</style>
</head>
<body>
<main class="page">
<p class="line">Nested span in anchor: <a href="#"><span>linguaggio</span> di <span>programmazione</span></a><span class="after"> followed by yellow text.</span></p>
<p class="line">Nested style in anchor: <a href="#"><i>codice</i> <b>sorgente</b></a><span class="after"> followed by yellow text.</span></p>
<p class="line">Nested neutral span before anchor: <span>termine</span> <a href="#"><span>compilatore</span></a><span class="after"> followed by yellow text.</span></p>
</main>
<div class="label">119 - nested link children</div>
</body>
</html>
