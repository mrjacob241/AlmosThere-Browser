<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>89 - Flex Min Height Header No Center Gap</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #f7f8fa; font-family: system-ui, sans-serif; }
.shell { min-height: 720px; padding: 24px; background: #e9ecef; }
.header { display: flex; align-items: center; min-height: 360px; background: #ced4da; border: 1px solid rgba(20,30,40,.18); }
.nav { width: 180px; height: 44px; background: #ff8787; }
.tools { width: 180px; height: 44px; background: #4dabf7; margin-left: auto; }
.content { height: 120px; background: #b2f2bb; border: 1px solid rgba(20,30,40,.18); }
.label { position: fixed; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); border: 1px solid rgba(20,30,40,.18); padding: 6px 8px; font-size: 12px; }
</style>
</head>
<body>
<div class="shell"><header class="header"><div class="nav"></div><div class="tools"></div></header><main class="content"></main></div>
<div class="label">89 / 89 - Flex Min Height Header No Center Gap</div>
</body>
