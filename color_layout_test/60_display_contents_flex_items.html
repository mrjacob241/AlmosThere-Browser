<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>60 - Display Contents Flex Items</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f7f8fa; font-family: system-ui, sans-serif; }
.bar { display: flex; gap: 12px; align-items: stretch; }
.contents { display: contents; }
.box { min-height: 96px; border: 1px solid rgba(20,30,40,.18); display: grid; place-items: center; padding: 10px; font-weight: 700; flex: 1; }
.a { background: #51cf66; } .b { background: #4dabf7; } .c { background: #ffd43b; }
.label { position: fixed; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); border: 1px solid rgba(20,30,40,.18); padding: 6px 8px; font-size: 12px; }
</style>
</head>
<body>
<main class="bar"><div class="contents"><div class="box a">flex item 1</div><div class="box b">flex item 2</div></div><div class="box c">flex item 3</div></main>
<div class="label">60 / 82 - Display Contents Flex Items</div>
</body>
</html>
