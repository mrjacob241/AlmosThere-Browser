<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>112 - search fixture Overflow Wrapper Centering</title>
<style>
:root { --page: #f7f8fa; --line: rgba(20,30,40,.18); --blue: #4dabf7; --green: #51cf66; --yellow: #ffd43b; --pink: #f783ac; --muted: #5c6670; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: var(--page); color: #17212b; }
.box { min-height: 72px; border: 1px solid var(--line); display: grid; place-items: center; padding: 10px; font-size: 13px; font-weight: 700; color: rgba(0,0,0,.74); text-align: center; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.88); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.viewport-wrapper { overflow-x: clip; padding-block-start: 24px; }
.content-frame { inline-size: min(960px, calc(100vw - 32px)); margin-inline: auto; display: grid; gap: 16px; }
.search { background: var(--blue); min-height: 88px; }
.result { background: var(--green); min-height: 144px; }
.wide-card { inline-size: 100%; max-inline-size: 960px; background: var(--yellow); min-height: 96px; }
.related { background: var(--pink); min-height: 72px; }
</style>
</head>
<body>
<div class="viewport-wrapper">
  <main class="content-frame">
    <section class="box search">overflow wrapper must not reset centered child to the left</section>
    <article class="box result">result card</article>
    <section class="box wide-card">wide card constrained by parent frame</section>
    <section class="box related">related row</section>
  </main>
</div>
<div class="label">112 - overflow wrapper centering</div>
</body>
</html>
