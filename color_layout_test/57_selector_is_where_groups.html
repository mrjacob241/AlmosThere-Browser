<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>57 - Selector Is Where Groups</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f7f8fa; font-family: system-ui, sans-serif; }
.layout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.box { min-height: 104px; border: 1px solid rgba(20,30,40,.18); display: grid; place-items: center; padding: 10px; font-weight: 700; background: #ffd43b; }
:is(header, main, aside) > :where(.primary, .secondary) { background: #51cf66; }
footer :is(.primary, .secondary) { background: #ff6b6b; }
.label { position: fixed; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); border: 1px solid rgba(20,30,40,.18); padding: 6px 8px; font-size: 12px; }
</style>
</head>
<body>
<div class="layout">
<header><div class="box primary">header primary remains yellow</div></header>
<main><div class="box secondary">main secondary remains yellow</div></main>
<footer><div class="box primary">footer red control</div></footer>
</div>
<div class="label">57 / 82 - Selector Is Where Groups</div>
</body>
</html>
