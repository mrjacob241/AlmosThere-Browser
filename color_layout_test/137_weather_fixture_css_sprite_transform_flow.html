<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>137 - Weather Fixture CSS Sprite Transform Flow</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 28px; background: #f8f9fa; font: 14px/1.35 system-ui, sans-serif; }
.strip { width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 88px; background: #74c0fc; padding: 14px; border: 1px solid rgba(20,30,40,.2); }
.sprite { width: 52px; height: 36px; flex: 0 0 auto; background-color: #51cf66; background-image: url("missing-common3.png"); background-repeat: no-repeat; background-position: -125px -268px; transform: scale(.65); transform-origin: center; border: 4px solid #ff8787; }
.text { flex: 1; min-height: 48px; background: #ffd43b; padding: 10px; }
.after { width: 760px; margin: 14px auto 0; min-height: 80px; background: #d0bfff; padding: 12px; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.9); border: 1px solid rgba(20,30,40,.2); font-size: 12px; }
</style>
</head>
<body>
<div class="strip"><div class="sprite"></div><div class="text">Sprite background with transform should occupy its CSS layout slot and not collapse flow.</div></div>
<div class="after">Following content should sit below the flex strip, not overlap the transformed sprite.</div>
<div class="label">137 - css sprite transform flow</div>
</body>
