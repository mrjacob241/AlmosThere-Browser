<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 - Header Sidebar Content</title>
<style>

:root {
  --ink: #17212b;
  --muted: #5c6670;
  --page: #f7f8fa;
  --line: rgba(20, 30, 40, 0.18);
  --red: #ff6b6b;
  --orange: #f59f00;
  --yellow: #ffd43b;
  --green: #51cf66;
  --teal: #20c997;
  --cyan: #22b8cf;
  --blue: #4dabf7;
  --indigo: #748ffc;
  --violet: #9775fa;
  --pink: #f783ac;
  --gray: #ced4da;
  --dark: #495057;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--page);
}
.box {
  min-height: 48px;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  padding: 10px;
  font-size: 13px;
  font-weight: 700;
  color: rgba(0,0,0,0.74);
  text-align: center;
}
.tall { min-height: 160px; }
.xtall { min-height: 300px; }
.label {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 20;
  padding: 6px 8px;
  background: rgba(255,255,255,0.88);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}


.page { min-height: 100vh; display: grid; grid-template: "head head" 72px "side main" 1fr / 240px 1fr; }
header { grid-area: head; background: var(--red); }
aside { grid-area: side; background: var(--violet); }
main { grid-area: main; background: var(--green); }
@media (max-width: 760px) { .page { grid-template: "head" 64px "side" 80px "main" 1fr / 1fr; } }

</style>
</head>
<body>
<div class="page"><header class="box">header</header><aside class="box">sidebar</aside><main class="box">main</main></div>
<div class="label">03 / 50 - Header Sidebar Content</div>
</body>
</html>
