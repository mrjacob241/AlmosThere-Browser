<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>129 - Weather Fixture Hidden Carousel Lazy Slides</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 28px; background: #f8f9fa; font: 14px/1.35 system-ui, sans-serif; }
.carousel { width: 920px; margin: 0 auto; position: relative; overflow: hidden; padding: 16px; background: #74c0fc; border: 1px solid rgba(20,30,40,.2); }
.slides { margin: 0; padding: 0; list-style: none; }
.slide { min-height: 220px; padding: 14px; background: #ffd43b; border: 1px solid rgba(20,30,40,.18); }
.slide img { display: block; width: 100%; height: 132px; background: #51cf66; border: 6px solid #ff8787; }
.hidden-display { display: none; }
.hidden-visibility { visibility: hidden; height: 0; overflow: hidden; }
.offscreen { position: absolute; left: -9999px; top: 0; width: 100%; }
.caption { margin-top: 10px; min-height: 42px; background: #d0bfff; padding: 8px; }
.after { width: 920px; margin: 16px auto 0; min-height: 90px; background: #63e6be; border: 1px solid rgba(20,30,40,.18); padding: 12px; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.9); border: 1px solid rgba(20,30,40,.2); font-size: 12px; }
</style>
</head>
<body>
<section class="carousel">
<ul class="slides">
<li class="slide"><img alt="active webcam image"><div class="caption">Only this active slide should reserve height.</div></li>
<li class="slide hidden-display"><img alt="display none slide"><div class="caption">display none inactive slide</div></li>
<li class="slide hidden-visibility"><img alt="hidden slide"><div class="caption">visibility hidden inactive slide</div></li>
<li class="slide offscreen"><img alt="offscreen slide"><div class="caption">absolute offscreen inactive slide</div></li>
</ul>
</section>
<div class="after">Content after carousel should start below the single active slide, not after all inactive slides.</div>
<div class="label">129 - hidden carousel lazy slides</div>
</body>
</html>
