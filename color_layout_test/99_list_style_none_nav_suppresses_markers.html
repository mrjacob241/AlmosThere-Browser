<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>99 - List Style None Nav Suppresses Markers</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #f7f8fa; font-family: Arial, sans-serif; color: #17212b; }
.shell { width: 680px; margin: 32px; padding: 20px; background: #ffffff; border: 1px solid #ced4da; }
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 620px;
  padding: 12px;
  background: #d0ebff;
}
.brand { width: 120px; height: 40px; background: #ffd43b; }
ul.nav {
  display: flex;
  gap: 12px;
  list-style: none;
  margin: 0;
  padding: 0;
  background: #e7f5ff;
}
ul.nav li {
  display: list-item;
  width: 100px;
  height: 40px;
  background: #b2f2bb;
}
.below { width: 620px; height: 80px; margin-top: 14px; background: #fcc2d7; }
.label {
  position: fixed;
  right: 12px;
  bottom: 12px;
  padding: 6px 8px;
  background: #fff;
  border: 1px solid #c8c8c8;
  font-size: 12px;
}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="brand">brand</div>
    <ul class="nav">
      <li>Docs</li>
      <li>Examples</li>
      <li>About</li>
    </ul>
  </header>
  <section class="below">content</section>
</main>
<div class="label">99 / regression - list-style:none suppresses semantic li markers</div>
</body>
</html>
