<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09 - Dashboard Shell</title>
<style>

:root {
  --ink: #17212b;
  --muted: #5c6670;
  --page: #f7f8fa;
  --line: rgba(20, 30, 40, 0.18);
  --red: #ff6b6b;
  --orange: #f59f00;
  --yellow: #ffd43b;
  --green: #51cf66;
  --teal: #20c997;
  --cyan: #22b8cf;
  --blue: #4dabf7;
  --indigo: #748ffc;
  --violet: #9775fa;
  --pink: #f783ac;
  --gray: #ced4da;
  --dark: #495057;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--page);
}
.box {
  min-height: 48px;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  padding: 10px;
  font-size: 13px;
  font-weight: 700;
  color: rgba(0,0,0,0.74);
  text-align: center;
}
.tall { min-height: 160px; }
.xtall { min-height: 300px; }
.label {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 20;
  padding: 6px 8px;
  background: rgba(255,255,255,0.88);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}


.page { min-height: 100vh; display: grid; grid-template: "nav head" 64px "nav main" 1fr / 220px 1fr; }
nav { grid-area: nav; background: var(--dark); color: white; } header { grid-area: head; background: var(--blue); }
main { grid-area: main; padding: 16px; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 140px; gap: 12px; }
main .box:nth-child(1) { grid-column: span 2; background: var(--green); } main .box:nth-child(2) { background: var(--yellow); } main .box:nth-child(3) { background: var(--pink); }
main .box:nth-child(4) { grid-column: span 4; background: var(--cyan); }
@media (max-width: 800px) { .page { grid-template: "head" 60px "nav" 70px "main" 1fr / 1fr; } main { grid-template-columns: 1fr; } main .box { grid-column: auto !important; } }

</style>
</head>
<body>
<div class="page"><nav class="box">nav</nav><header class="box">toolbar</header><main><section class="box">panel 1</section><section class="box">panel 2</section><section class="box">panel 3</section><section class="box">panel 4</section><section class="box">panel 5</section><section class="box">panel 6</section></main></div>
<div class="label">09 / 50 - Dashboard Shell</div>
</body>
</html>
