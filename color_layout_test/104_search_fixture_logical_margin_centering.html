<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>104 - search fixture Logical Margin Centering</title>
<style>
:root { --page: #f7f8fa; --line: rgba(20,30,40,.18); --blue: #4dabf7; --green: #51cf66; --yellow: #ffd43b; --muted: #5c6670; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: var(--page); color: #17212b; }
.box { min-height: 64px; border: 1px solid var(--line); display: grid; place-items: center; padding: 10px; font-size: 13px; font-weight: 700; color: rgba(0,0,0,.74); text-align: center; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.88); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.results-shell { width: min(960px, calc(100vw - 32px)); margin-block: 24px; margin-inline: auto; display: grid; gap: 16px; }
.query { background: var(--blue); min-height: 96px; }
.result { background: var(--green); min-height: 180px; }
.related { background: var(--yellow); }
</style>
</head>
<body>
<main class="results-shell">
  <section class="box query">logical margin-inline should center this shell</section>
  <section class="box result">main result column</section>
  <section class="box related">related searches</section>
</main>
<div class="label">104 - logical margin-inline centering</div>
</body>
</html>
