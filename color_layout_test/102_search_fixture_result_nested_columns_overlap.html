<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>102 Search Fixture result nested columns overlap</title>
<style>
html, body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #eef3f6; }
.fixture-main { width: 760px; margin: 28px auto; background: #d7edf8; padding: 18px; }
.fixture_main__result { display: flex; width: 630px; padding: 12px; background: #ffc7c2; }
.sample_item__body { display: flex; flex-flow: column nowrap; min-width: 0; width: 760px; background: #fbe5a6; }
.sample_item__header { display: block; padding: 4px; background: #c7e8b4; }
.sample_item__info { display: flex; min-width: 0; background: #a9d6e5; }
.fixture-source__link { display: inline; max-width: 100%; overflow: hidden; color: #333; }
.fixture-source-line { display: block; max-width: 100%; overflow: hidden; font-size: 12px; line-height: 1.35; background: #d2c6ff; }
.sample_item__title { display: flex; position: relative; width: 760px; overflow: hidden; background: #82cfd0; }
.sample_item__link { display: inline; max-width: 100%; overflow: hidden; color: #1a0dab; }
.fixture-title__heading { display: block; max-width: 100%; overflow: hidden; font-size: 20px; line-height: 1.35; margin: 0; background: #91d18b; }
.sample_item__columns { display: flex; padding-left: 4px; padding-right: 4px; background: #f3aac1; }
.sample_item__columns-start { display: block; min-width: 0; background: #ffdd75; }
.sample_item__description { display: flex; background: #cbb6ff; }
.fixture_snippet__description { display: block; overflow: hidden; font-size: 14px; line-height: 1.35; margin: 0; background: #ffffff; }
</style>
</head>
<body>
<section class="fixture-main">
  <article class="fixture_main__result">
    <div class="sample_item__body">
      <div class="sample_item__header">
        <div class="sample_item__info"><a class="fixture-source__link" href="#"><div class="fixture-source-line">https://example.test › wiki › Example_topic</div></a></div>
        <div class="sample_item__title"><a class="sample_item__link" href="#"><h2 class="fixture-title__heading">Example topic - Reference Article</h2></a></div>
      </div>
      <div class="sample_item__columns"><div class="sample_item__columns-start"><div class="sample_item__description"><p class="fixture_snippet__description">In sample text Example topic! should sit below the title band.</p></div></div></div>
    </div>
  </article>
</section>
</body>
</html>
