<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>113 - search fixture Sidebar Aware Result Shell</title>
<style>
:root { --page: #f7f8fa; --line: rgba(20,30,40,.18); --blue: #4dabf7; --green: #51cf66; --yellow: #ffd43b; --cyan: #22b8cf; --muted: #5c6670; --left-rail: 96px; --main: 680px; --gap: 24px; --side: 260px; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: var(--page); color: #17212b; }
.box { min-height: 72px; border: 1px solid var(--line); display: grid; place-items: center; padding: 10px; font-size: 13px; font-weight: 700; color: rgba(0,0,0,.74); text-align: center; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.88); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.search-shell { inline-size: calc(var(--left-rail) + var(--main) + var(--gap) + var(--side)); margin-inline: auto; margin-block-start: 24px; display: grid; gap: 12px; }
.searchbar { margin-inline-start: var(--left-rail); inline-size: calc(var(--main) + var(--gap) + var(--side)); background: var(--blue); min-height: 72px; }
.body { display: grid; grid-template-columns: var(--left-rail) minmax(0, var(--main)) var(--gap) minmax(0, var(--side)); }
.left-gutter { min-height: 220px; }
.results { display: grid; gap: 12px; }
.result { background: var(--green); min-height: 104px; }
.spacer { min-height: 220px; }
.side { background: var(--yellow); min-height: 220px; }
.bottom { margin-inline-start: var(--left-rail); inline-size: calc(var(--main) + var(--gap) + var(--side)); background: var(--cyan); min-height: 72px; }
</style>
</head>
<body>
<main class="search-shell">
  <section class="box searchbar">search bar and tabs start after the left rail</section>
  <div class="body">
    <div class="left-gutter"></div>
    <section class="results">
      <article class="box result">result one</article>
      <article class="box result">result two</article>
    </section>
    <div class="spacer"></div>
    <aside class="box side">side panel</aside>
  </div>
  <section class="box bottom">bottom row aligned with results plus side panel</section>
</main>
<div class="label">113 - sidebar aware result shell</div>
</body>
</html>
