<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>178 - flex nav mobile media center after unset</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: system-ui, sans-serif; background: #f7f8fa; padding: 24px; color: #17212b; }
.shell { width: 520px; min-height: 170px; background: #e7f5ff; border: 2px solid #339af0; padding: 16px; }
.nav {
  display: flex;
  justify-content: unset;
  align-items: center;
  width: 100%;
  min-height: 64px;
  background: #ffd43b;
  padding: 8px;
}
@media only screen and (width <= calc(100rem - 1px)) {
  .nav { justify-content: center; }
}
.tabs {
  display: flex;
  gap: 2px;
  height: 40px;
  margin: 0;
  padding: 4px;
  list-style: none;
  background: #51cf66;
  border: 1px solid rgba(20,30,40,.18);
  border-radius: 9999px;
}
.tabs li { display: flex; min-width: 48px; align-items: center; justify-content: center; background: #d0bfff; border-radius: 9999px; }
.tabs a { display: flex; align-items: center; gap: 4px; width: 100%; padding: 8px 11px; color: inherit; text-decoration: none; }
.icon { flex: 0 0 auto; width: 16px; height: 16px; background: #ff6b6b; border-radius: 50%; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.9); border: 1px solid rgba(20,30,40,.18); font-size: 12px; color: #5c6670; }
</style>
</head>
<body>
<main class="shell">
  <div class="nav">
    <ul class="tabs">
      <li><a href="#"><span class="icon"></span><span>Web</span></a></li>
      <li><a href="#"><span class="icon"></span><span>AI Chat</span></a></li>
      <li><a href="#"><span class="icon"></span><span>Images</span></a></li>
    </ul>
  </div>
</main>
<div class="label">178 - mobile media center wins after unset base</div>
</body>
</html>
