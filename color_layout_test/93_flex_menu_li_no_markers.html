<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>93 - Flex Menu Li No Markers</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #151515; font-family: Arial, sans-serif; color: #f5f5f5; }
.shell { width: 760px; margin: 32px; padding: 24px; background: #222; }
.nav {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 640px;
  height: 48px;
  margin: 0;
  padding: 0;
  background: #2f9e44;
}
.nav li {
  display: flex;
  height: 40px;
  margin: 0;
  padding: 0;
  background: #4dabf7;
}
.nav a {
  display: flex;
  align-items: center;
  padding: 8px 10px;
  color: #fff;
  text-decoration: none;
  background: #f59f00;
}
.label {
  position: fixed;
  right: 12px;
  bottom: 12px;
  padding: 6px 8px;
  background: #fff;
  border: 1px solid #c8c8c8;
  color: #222;
  font-size: 12px;
}
</style>
</head>
<body>
<main class="shell">
  <ul class="nav">
    <li><a href="#">Web</a></li>
    <li><a href="#">Images</a></li>
    <li><a href="#">News</a></li>
    <li><a href="#">Videos</a></li>
    <li><a href="#">Maps</a></li>
  </ul>
</main>
<div class="label">93 / regression - flex li menu has no bullets</div>
</body>
</html>
