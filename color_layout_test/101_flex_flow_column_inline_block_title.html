<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>101 flex-flow column inline block title</title>
<style>
html, body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #f4f6f8; }
.page { width: 720px; margin: 32px auto; background: #d9e8ff; padding: 20px; }
.result { display: flex; flex-flow: column nowrap; width: 640px; background: #ffe0b2; padding: 12px; }
.title { display: flex; width: 620px; overflow: hidden; background: #8fd3c7; }
.title a { display: inline; max-width: 100%; overflow: hidden; color: #173f8a; }
.title h2 { display: block; margin: 0; font-size: 24px; line-height: 1.35; overflow: hidden; background: #b7e7a6; }
.snippet { display: flex; margin-top: 0; background: #f7a8b8; }
.snippet p { display: block; margin: 0; font-size: 16px; line-height: 1.35; background: #ffd966; }
</style>
</head>
<body>
<main class="page">
  <article class="result">
    <div class="title"><a href="#"><h2>Example topic - Reference Article</h2></a></div>
    <div class="snippet"><p>Snippet must start below the green title block, never overlap it.</p></div>
  </article>
</main>
</body>
</html>
