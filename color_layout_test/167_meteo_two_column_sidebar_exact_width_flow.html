<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>167 - Meteo Two Column Sidebar Exact Width Flow</title>
<style>
body { margin: 0; font-family: Arial, sans-serif; background: #eef2f7; }
.backgroundPage { width: 976px; margin: 24px auto; padding-left: 19.2px; padding-right: 19.2px; box-sizing: border-box; }
.ggVEuA { display: flex; flex-wrap: wrap; margin-left: -8px; margin-right: -8px; background: #f8f9fa; }
.dZRBqV { box-sizing: border-box; flex: 0 0 66.666666%; max-width: 66.666666%; padding-left: 8px; padding-right: 8px; }
.itcVQh { box-sizing: border-box; flex: 0 0 33.333333%; max-width: 33.333333%; padding-left: 8px; padding-right: 8px; }
.mainCard { min-height: 520px; border-radius: 10px; background: #91d5ff; overflow: hidden; }
.mainCard h1 { margin: 0; padding: 190px 24px 0; font-size: 28px; line-height: 1.35; color: #1f2933; }
.llWYdN { position: relative; border-radius: 13px; background: #ffffff; overflow: hidden; min-height: 450px; }
.jrOoie { position: absolute; left: 0; top: 0; min-width: 160px; height: 40px; display: flex; align-items: center; padding-left: 14px; padding-right: 22px; box-sizing: border-box; background: #1155a3; color: #ffffff; font-weight: 700; }
.llWYdN > ul { padding-top: 50px; padding-left: 0; margin: 0; display: flex; width: 100%; flex-direction: column; justify-content: space-between; }
.llWYdN > ul .containerSliderLink { display: flex; flex-direction: column; }
.llWYdN > ul > div > a { display: flex; align-items: center; width: 100%; padding-left: 20px; padding-right: 20px; height: 50px; box-sizing: border-box; color: #075985; text-decoration: none; }
.llWYdN > ul > div > a > div:not(.containerSliderLink):not(.dividerLocation) { flex-grow: 2; height: 50px; display: flex; align-items: center; background: #d3f9d8; }
.llWYdN > ul > div > a > div:not(.containerSliderLink):not(.dividerLocation) > p { font-weight: bold; height: 17px; margin: 0 0 0 5px; font-size: 14px; }
.llWYdN > ul > div > a > span { color: #636363; font-size: 14px; height: 19px; display: flex; width: 50px; background: #ffe8cc; }
.llWYdN > ul > div > a > span > span { display: flex; width: 25px; }
.icon { width: 32px; height: 32px; flex: 0 0 auto; background: #ced4da; }
.dividerLocation { margin-left: 20px; box-sizing: border-box; background: #f0f0f0; height: 1px; }
</style>
</head>
<body>
<main class="backgroundPage">
  <div class="ggVEuA">
    <div class="dZRBqV">
      <article class="mainCard"><h1>Meteo Palermo oggi. Previsioni del tempo, precipitazioni, temperatura e venti</h1></article>
    </div>
    <aside class="itcVQh">
      <div class="llWYdN">
        <span class="jrOoie">Meteo citta italiane</span>
        <ul>
          <div class="containerSliderLink"><a href="#"><div><span class="icon"></span><p>Torino</p></div><span><span>14</span><span>25</span></span></a><div class="dividerLocation"></div></div>
          <div class="containerSliderLink"><a href="#"><div><span class="icon"></span><p>Genova</p></div><span><span>20</span><span>24</span></span></a><div class="dividerLocation"></div></div>
          <div class="containerSliderLink"><a href="#"><div><span class="icon"></span><p>Milano</p></div><span><span>16</span><span>25</span></span></a><div class="dividerLocation"></div></div>
          <div class="containerSliderLink"><a href="#"><div><span class="icon"></span><p>Palermo</p></div><span><span>20</span><span>27</span></span></a></div>
        </ul>
      </div>
    </aside>
  </div>
</main>
</body>
</html>
