<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>150 - flex min width zero allows metric shrink</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f1f3f5; font: 15px/1.35 system-ui, sans-serif; }
.panel { width: 360px; margin: 0 auto; padding: 12px; background: #dee2e6; border: 2px solid #343a40; }
.row { display: flex; align-items: center; gap: 8px; width: 100%; background: #d3f9d8; border: 1px solid rgba(20,30,40,.25); padding: 8px; }
.icon { flex: 0 0 44px; height: 44px; background: #ffd43b; }
.summary { flex: 1 1 auto; min-width: 0; background: #91a7ff; padding: 8px; }
.metric { flex: 1 1 auto; min-width: 0; background: #ff922b; padding: 8px; text-align: center; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.9); border: 1px solid rgba(20,30,40,.2); font-size: 12px; }
</style>
</head>
<body>
<section class="panel">
  <div class="row">
    <div class="icon"></div>
    <div class="summary">Poco nuvoloso con vento moderato</div>
    <div class="metric">Nord Ovest</div>
    <div class="metric">Gibbosa calante</div>
  </div>
</section>
<div class="label">150 - explicit min-width:0 may shrink</div>
</body>
</html>
