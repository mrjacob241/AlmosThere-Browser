<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>170 - Flex Zero Basis Nested Button Content</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #f1f3f5; font: 14px/1.35 Arial, sans-serif; color: #1f2933; padding: 28px; }
.shell { width: 760px; padding: 20px; background: #ffffff; border: 2px solid #343a40; }
.toolbar { display: flex; align-items: center; gap: 8px; width: 620px; padding: 6px; background: #e7f5ff; border: 1px solid #339af0; border-radius: 9999px; }
.button {
  display: flex;
  flex: 0 1 0;
  align-items: center;
  justify-content: center;
  min-height: 34px;
  padding: 8px 12px;
  border: 0;
  border-radius: 9999px;
  background: #ffd43b;
}
.content { display: contents; }
.text {
  display: inline-flex;
  flex: 1;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
  background: rgba(255,255,255,.45);
}
.icon { flex: 0 0 auto; width: 16px; height: 16px; background: #e03131; border-radius: 50%; }
.selected { background: #343a40; color: #ffffff; }
.tail { flex: 1 1 auto; min-width: 0; height: 34px; background: #63e6be; border-radius: 9999px; }
.badge { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.9); border: 1px solid rgba(20,30,40,.2); font-size: 12px; }
</style>
</head>
<body>
<section class="shell">
  <div class="toolbar">
    <button class="button selected"><span class="content"><span class="text"><span class="icon"></span>Web</span></span></button>
    <button class="button"><span class="content"><span class="text"><span class="icon"></span>AI Chat</span></span></button>
    <button class="button"><span class="content"><span class="text"><span class="icon"></span>Images</span></span></button>
    <button class="button"><span class="content"><span class="text"><span class="icon"></span>Videos</span></span></button>
    <button class="button"><span class="content"><span class="text"><span class="icon"></span>News</span></span></button>
    <div class="tail"></div>
  </div>
</section>
<div class="badge">170 - flex:0/zero-basis button still has child auto min size</div>
</body>
</html>
