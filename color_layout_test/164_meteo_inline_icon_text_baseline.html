<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>156 meteo inline icon text baseline</title>
<style>
body { margin: 0; background: #f5f7fa; font-family: Arial, sans-serif; }
.line { width: 680px; margin: 32px auto; background: #ffffff; padding: 16px; font-size: 22px; line-height: 1.4; }
.icon { display: inline-block; width: 28px; height: 28px; background: #ffd43b; vertical-align: middle; }
.value { color: #b00020; font-weight: 700; white-space: nowrap; }
.link { color: #075985; text-decoration: underline; }
</style>
</head>
<body>
<p class="line"><span class="icon"></span> Sereno, temperatura <span class="value">27°</span>, vento <a class="link">Nord NE 9-13 Km/h</a> e umidita stabile.</p>
</body>
</html>
