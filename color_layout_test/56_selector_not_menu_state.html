<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>56 - Selector Not Menu State</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f7f8fa; font-family: system-ui, sans-serif; }
.shell { display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
.box { min-height: 96px; border: 1px solid rgba(20,30,40,.18); display: grid; place-items: center; padding: 10px; font-weight: 700; background: #ffd43b; }
body:not(.menu-open) .drawer { display: none; }
body:not(.menu-open) .content { grid-column: 1 / -1; background: #51cf66; }
.drawer { background: #ff6b6b; }
.label { position: fixed; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); border: 1px solid rgba(20,30,40,.18); padding: 6px 8px; font-size: 12px; }
</style>
</head>
<body>
<main class="shell">
<aside class="box drawer">drawer hidden by :not()</aside>
<section class="box content">content should span full width</section>
</main>
<div class="label">56 / 82 - Selector Not Menu State</div>
</body>
</html>
