<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 - Auto Fit Card Grid</title>
<style>

:root {
  --ink: #17212b;
  --muted: #5c6670;
  --page: #f7f8fa;
  --line: rgba(20, 30, 40, 0.18);
  --red: #ff6b6b;
  --orange: #f59f00;
  --yellow: #ffd43b;
  --green: #51cf66;
  --teal: #20c997;
  --cyan: #22b8cf;
  --blue: #4dabf7;
  --indigo: #748ffc;
  --violet: #9775fa;
  --pink: #f783ac;
  --gray: #ced4da;
  --dark: #495057;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--page);
}
.box {
  min-height: 48px;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  padding: 10px;
  font-size: 13px;
  font-weight: 700;
  color: rgba(0,0,0,0.74);
  text-align: center;
}
.tall { min-height: 160px; }
.xtall { min-height: 300px; }
.label {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 20;
  padding: 6px 8px;
  background: rgba(255,255,255,0.88);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}


.page { padding: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.box:nth-child(1) { background: var(--red); } .box:nth-child(2) { background: var(--orange); } .box:nth-child(3) { background: var(--yellow); }
.box:nth-child(4) { background: var(--green); } .box:nth-child(5) { background: var(--cyan); } .box:nth-child(6) { background: var(--blue); }
.box:nth-child(7) { background: var(--violet); } .box:nth-child(8) { background: var(--pink); }

</style>
</head>
<body>
<main class="page"><section class="box tall">auto card 1</section><section class="box tall">auto card 2</section><section class="box tall">auto card 3</section><section class="box tall">auto card 4</section><section class="box tall">auto card 5</section><section class="box tall">auto card 6</section><section class="box tall">auto card 7</section><section class="box tall">auto card 8</section></main>
<div class="label">05 / 50 - Auto Fit Card Grid</div>
</body>
</html>
