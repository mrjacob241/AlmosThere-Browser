<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12 - Nested Grid</title>
<style>

:root {
  --ink: #17212b;
  --muted: #5c6670;
  --page: #f7f8fa;
  --line: rgba(20, 30, 40, 0.18);
  --red: #ff6b6b;
  --orange: #f59f00;
  --yellow: #ffd43b;
  --green: #51cf66;
  --teal: #20c997;
  --cyan: #22b8cf;
  --blue: #4dabf7;
  --indigo: #748ffc;
  --violet: #9775fa;
  --pink: #f783ac;
  --gray: #ced4da;
  --dark: #495057;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--page);
}
.box {
  min-height: 48px;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  padding: 10px;
  font-size: 13px;
  font-weight: 700;
  color: rgba(0,0,0,0.74);
  text-align: center;
}
.tall { min-height: 160px; }
.xtall { min-height: 300px; }
.label {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 20;
  padding: 6px 8px;
  background: rgba(255,255,255,0.88);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}


.shell { padding: 20px; display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
.main { background: var(--cyan); padding: 12px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.main .box { background: var(--green); } .rail { background: var(--orange); display: grid; gap: 12px; padding: 12px; align-content: start; }
.rail .box { background: var(--yellow); }
@media (max-width: 820px) { .shell { grid-template-columns: 1fr; } }

</style>
</head>
<body>
<div class="shell"><main class="main box"><section class="box tall">nested 1</section><section class="box tall">nested 2</section><section class="box tall">nested 3</section><section class="box tall">nested 4</section></main><aside class="rail box"><section class="box">rail 1</section><section class="box">rail 2</section><section class="box">rail 3</section></aside></div>
<div class="label">12 / 50 - Nested Grid</div>
</body>
</html>
