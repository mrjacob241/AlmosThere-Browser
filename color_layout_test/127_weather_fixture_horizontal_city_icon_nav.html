<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>127 - weather fixture Horizontal City Icon Nav</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 28px; background: #f8f9fa; font: 14px/1.3 system-ui, sans-serif; }
.city-nav { width: 1040px; margin: 0 auto; padding: 12px; background: #74c0fc; border: 1px solid rgba(20,30,40,.2); }
ul { margin: 0; padding: 0; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
li { flex: 1 1 0; min-width: 0; background: #fff3bf; border: 1px solid rgba(20,30,40,.18); }
a { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; min-height: 92px; color: #17212b; text-decoration: none; background: #d0bfff; }
img { width: 34px; height: 34px; display: block; background: #51cf66; border: 4px solid #ff8787; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.9); border: 1px solid rgba(20,30,40,.2); font-size: 12px; }
@media (max-width: 760px) { .city-nav { width: auto; } ul { flex-wrap: wrap; } li { flex-basis: calc(50% - 5px); } }
</style>
</head>
<body>
<nav class="city-nav">
<ul>
<li><a href="#"><img src="city-roma.svg" alt="">Roma</a></li>
<li><a href="#"><img src="city-milano.svg" alt="">Milano</a></li>
<li><a href="#"><img src="city-napoli.svg" alt="">Napoli</a></li>
<li><a href="#"><img src="city-torino.svg" alt="">Torino</a></li>
<li><a href="#"><img src="city-palermo.svg" alt="">Palermo</a></li>
<li><a href="#"><img src="city-genova.svg" alt="">Genova</a></li>
</ul>
</nav>
<div class="label">127 - horizontal city icon nav</div>
</body>
</html>
