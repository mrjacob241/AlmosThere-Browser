<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>17 - search fixture Suggestions Overlay</title>
<style>

:root {
  --ink: #17212b;
  --muted: #5c6670;
  --page: #f7f8fa;
  --line: rgba(20, 30, 40, 0.18);
  --red: #ff6b6b;
  --orange: #f59f00;
  --yellow: #ffd43b;
  --green: #51cf66;
  --teal: #20c997;
  --cyan: #22b8cf;
  --blue: #4dabf7;
  --indigo: #748ffc;
  --violet: #9775fa;
  --pink: #f783ac;
  --gray: #ced4da;
  --dark: #495057;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--page);
}
.box {
  min-height: 48px;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  padding: 10px;
  font-size: 13px;
  font-weight: 700;
  color: rgba(0,0,0,0.74);
  text-align: center;
}
.tall { min-height: 160px; }
.xtall { min-height: 300px; }
.label {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 20;
  padding: 6px 8px;
  background: rgba(255,255,255,0.88);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}


.page { min-height: 100vh; display: grid; grid-template-rows: 72px 1fr; background: #eef5f2; }
header { background: var(--green); display: grid; grid-template-columns: 180px 1fr 64px; gap: 12px; padding: 12px; }
.logo { background: var(--yellow); } .query { background: white; } .icon { background: var(--blue); }
main { padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; }
.results { display: grid; gap: 12px; } .result { background: var(--cyan); min-height: 92px; }
.rail { background: var(--orange); }
.overlay { position: fixed; inset: 96px auto auto 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); display: grid; gap: 8px; padding: 12px; background: rgba(255,255,255,.94); border: 3px solid var(--dark); }
.overlay .box { background: var(--pink); }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } header { grid-template-columns: 1fr 64px; } .logo { display:none; } }

</style>
</head>
<body>
<div class="page"><header><div class="box logo">brand</div><div class="box query">query field</div><div class="box icon">icon</div></header><main><section class="results"><article class="box result">result 1</article><article class="box result">result 2</article><article class="box result">result 3</article><article class="box result">result 4</article><article class="box result">result 5</article></section><aside class="box rail">rail</aside></main><div class="overlay"><div class="box">overlay row 1</div><div class="box">overlay row 2</div><div class="box">overlay row 3</div></div></div>
<div class="label">17 / 50 - search fixture Suggestions Overlay</div>
</body>
</html>
