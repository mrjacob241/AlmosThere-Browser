<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>109 - Search Fixture Layered Logical Centering</title>
<style>
:root { --page: #f7f8fa; --line: rgba(20,30,40,.18); --blue: #4dabf7; --green: #51cf66; --yellow: #ffd43b; --muted: #5c6670; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: var(--page); color: #17212b; }
.box { min-height: 72px; border: 1px solid var(--line); display: grid; place-items: center; padding: 10px; font-size: 13px; font-weight: 700; color: rgba(0,0,0,.74); text-align: center; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.88); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
@layer app {
  .results-shell { inline-size: min(960px, calc(100vw - 32px)); margin-inline: auto; margin-block-start: 24px; display: grid; gap: 16px; }
  .query { background: var(--blue); min-height: 88px; }
  .result { background: var(--green); min-height: 160px; }
  .related { background: var(--yellow); min-height: 72px; }
}
</style>
</head>
<body>
<main class="results-shell">
  <section class="box query">layered CSS should still center this search/results shell</section>
  <section class="box result">result area</section>
  <section class="box related">related strip</section>
</main>
<div class="label">109 - layered logical centering</div>
</body>
</html>
