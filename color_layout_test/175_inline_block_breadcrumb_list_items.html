<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>175 Inline Block Breadcrumb List Items</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #f5f7fa;
      font-family: sans-serif;
    }

    .card {
      width: 640px;
      margin: 40px auto;
      padding: 32px 24px;
      background: #ffffff;
      overflow: hidden;
    }

    .breadcrumb-shell {
      overflow: hidden;
      font-size: 18px;
      background: #d0ebff;
    }

    .breadcrumbs {
      float: left;
      margin: 16px 0 12px 0;
      padding: 0;
      background: #ffd43b;
    }

    .breadcrumbs li {
      display: inline-block;
      padding-left: 0;
      background: #51cf66;
    }

    .breadcrumbs a {
      color: #075985;
      text-decoration: underline;
    }

    h1 {
      clear: both;
      margin: 24px 0 0 0;
      font-size: 28px;
      line-height: 1.35;
      background: #ffc9c9;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="breadcrumb-shell">
      <ol class="breadcrumbs">
        <li><a href="#">Meteo</a></li>
        <li><a href="#">Italia</a></li>
        <li><a href="#">Sicilia</a></li>
        <li>Palermo oggi</li>
      </ol>
    </div>
    <h1>Meteo Palermo oggi. Previsioni del tempo, precipitazioni, temperatura e venti</h1>
  </main>
</body>
</html>
