<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>126 - weather fixture Weather Icon Table Cells</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f1f3f5; font: 14px/1.25 system-ui, sans-serif; }
.table { width: 1080px; margin: 0 auto; background: #fff; border: 1px solid rgba(20,30,40,.22); }
.row { display: flex; align-items: center; min-height: 48px; border-bottom: 1px solid rgba(20,30,40,.16); background: #e7f5ff; }
.row:nth-child(odd) { background: #d3f9d8; }
.cell { min-width: 0; padding: 6px 8px; text-align: center; border-right: 1px solid rgba(20,30,40,.12); }
.time { width: 9%; background: #ffd43b; }
.icon { width: 9%; background: #ffc9c9; display: flex; justify-content: center; align-items: center; }
.icon img { width: 28px; height: 28px; background: #5c7cfa; display: block; }
.desc { width: 28%; text-align: left; background: #d0bfff; }
.temp { width: 12%; background: #ff922b; }
.wind { width: 16%; background: #63e6be; }
.rain { width: 10%; background: #91a7ff; }
.uv { width: 8%; background: #f783ac; }
.more { width: 8%; background: #ced4da; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.9); border: 1px solid rgba(20,30,40,.2); font-size: 12px; }
</style>
</head>
<body>
<main class="table">
<div class="row"><div class="cell time">09</div><div class="cell icon"><img src="missing-s1.gif" alt=""></div><div class="cell desc">Poco nuvoloso con vento moderato</div><div class="cell temp">25 C</div><div class="cell wind">WNW 12</div><div class="cell rain">0%</div><div class="cell uv">5</div><div class="cell more">+</div></div>
<div class="row"><div class="cell time">12</div><div class="cell icon"><img src="missing-s3.gif" alt=""></div><div class="cell desc">Nubi sparse</div><div class="cell temp">29 C</div><div class="cell wind">N 8</div><div class="cell rain">5%</div><div class="cell uv">7</div><div class="cell more">+</div></div>
<div class="row"><div class="cell time">15</div><div class="cell icon"><img src="missing-s8.gif" alt=""></div><div class="cell desc">Sereno caldo</div><div class="cell temp">32 C</div><div class="cell wind">W 15</div><div class="cell rain">0%</div><div class="cell uv">8</div><div class="cell more">+</div></div>
</main>
<div class="label">126 - weather icon table cells</div>
</body>
</html>
