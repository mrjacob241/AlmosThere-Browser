<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>07 - Holy Grail Layout</title>
<style>

:root {
  --ink: #17212b;
  --muted: #5c6670;
  --page: #f7f8fa;
  --line: rgba(20, 30, 40, 0.18);
  --red: #ff6b6b;
  --orange: #f59f00;
  --yellow: #ffd43b;
  --green: #51cf66;
  --teal: #20c997;
  --cyan: #22b8cf;
  --blue: #4dabf7;
  --indigo: #748ffc;
  --violet: #9775fa;
  --pink: #f783ac;
  --gray: #ced4da;
  --dark: #495057;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--page);
}
.box {
  min-height: 48px;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  padding: 10px;
  font-size: 13px;
  font-weight: 700;
  color: rgba(0,0,0,0.74);
  text-align: center;
}
.tall { min-height: 160px; }
.xtall { min-height: 300px; }
.label {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 20;
  padding: 6px 8px;
  background: rgba(255,255,255,0.88);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}


.page { min-height: 100vh; display: grid; grid-template: "head head head" 68px "left main right" 1fr "foot foot foot" 64px / 220px minmax(0,1fr) 260px; }
header { grid-area: head; background: var(--red); } .left { grid-area: left; background: var(--orange); }
main { grid-area: main; background: var(--green); } .right { grid-area: right; background: var(--blue); } footer { grid-area: foot; background: var(--yellow); }
@media (max-width: 900px) { .page { grid-template: "head" 64px "main" auto "left" 120px "right" 120px "foot" 60px / 1fr; } }

</style>
</head>
<body>
<div class="page"><header class="box">header</header><aside class="box left">left nav</aside><main class="box xtall">main</main><aside class="box right">right rail</aside><footer class="box">footer</footer></div>
<div class="label">07 / 50 - Holy Grail Layout</div>
</body>
</html>
