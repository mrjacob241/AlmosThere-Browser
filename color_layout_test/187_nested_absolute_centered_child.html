<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>187 Nested Absolute Centered Child</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #202020;
    }
    .hero {
      position: relative;
      width: 760px;
      height: 420px;
      background: #214d3e;
      overflow: hidden;
    }
    .shell {
      position: absolute;
      left: 50%;
      bottom: 36px;
      transform: translateX(-50%);
      width: 420px;
      min-height: 104px;
      background: #7ca68d;
      border: 2px solid #ffffff;
    }
    .badge {
      position: absolute;
      left: 50%;
      top: 16px;
      transform: translateX(-50%);
      width: 260px;
      height: 72px;
      background: #e9d05f;
      border: 2px solid #1a1a1a;
    }
  </style>
</head>
<body>
  <main class="hero">
    <section class="shell">
      <div class="badge"></div>
    </section>
  </main>
</body>
</html>
