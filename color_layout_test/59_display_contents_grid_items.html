<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>59 - Display Contents Grid Items</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f7f8fa; font-family: system-ui, sans-serif; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.wrapper { display: contents; }
.box { min-height: 96px; border: 1px solid rgba(20,30,40,.18); display: grid; place-items: center; padding: 10px; font-weight: 700; }
.a { background: #51cf66; } .b { background: #4dabf7; } .c { background: #ffd43b; } .d { background: #f783ac; }
.label { position: fixed; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); border: 1px solid rgba(20,30,40,.18); padding: 6px 8px; font-size: 12px; }
</style>
</head>
<body>
<main class="grid"><div class="wrapper"><div class="box a">1 direct via contents</div><div class="box b">2 direct via contents</div></div><div class="box c">3</div><div class="box d">4</div></main>
<div class="label">59 / 82 - Display Contents Grid Items</div>
</body>
</html>
