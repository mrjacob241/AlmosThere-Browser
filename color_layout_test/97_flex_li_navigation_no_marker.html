<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>97 - Flex LI Navigation No Marker</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #f7f8fa; font-family: Arial, sans-serif; color: #17212b; }
.bar { width: 620px; margin: 32px; padding: 14px; background: #ffffff; border: 1px solid #ced4da; }
ul.nav {
  display: flex;
  gap: 12px;
  margin: 0;
  padding: 0;
  width: 560px;
  background: #e7f5ff;
}
li.item {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 120px;
  height: 44px;
  background: #b2f2bb;
  border: 1px solid #69db7c;
}
.tab { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; background: #ffd43b; }
.label {
  position: fixed;
  right: 12px;
  bottom: 12px;
  padding: 6px 8px;
  background: #fff;
  border: 1px solid #c8c8c8;
  font-size: 12px;
}
</style>
</head>
<body>
<nav class="bar">
  <ul class="nav">
    <li class="item"><a class="tab">Web</a></li>
    <li class="item"><a class="tab">Images</a></li>
    <li class="item"><a class="tab">News</a></li>
    <li class="item"><a class="tab">Videos</a></li>
  </ul>
</nav>
<div class="label">97 / regression - display:flex li behaves as flex item, not list-item</div>
</body>
</html>
