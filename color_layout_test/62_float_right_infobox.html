<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>62 - Float Right Infobox</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f7f8fa; font-family: system-ui, sans-serif; }
.article { max-width: 900px; border: 1px solid rgba(20,30,40,.18); padding: 16px; background: #fff; }
.infobox { float: right; width: 260px; height: 240px; margin: 0 0 12px 18px; background: #ffd43b; border: 1px solid rgba(20,30,40,.18); display: grid; place-items: center; font-weight: 700; }
p { margin: 0 0 14px; min-height: 72px; background: #b2f2bb; padding: 10px; }
.label { position: fixed; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); border: 1px solid rgba(20,30,40,.18); padding: 6px 8px; font-size: 12px; }
</style>
</head>
<body>
<article class="article"><aside class="infobox">right float infobox</aside><p>Paragraph should wrap beside the infobox instead of pushing it into a full-width block.</p><p>Second paragraph continues beside or below depending on available height.</p><p>Third paragraph should clear naturally after float height.</p></article>
<div class="label">62 / 82 - Float Right Infobox</div>
</body>
</html>
