<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>78 - Table Rowspan Infobox</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f7f8fa; font-family: system-ui, sans-serif; }
table { width: 620px; border-collapse: collapse; }
td, th { border: 2px solid rgba(20,30,40,.25); min-height: 64px; padding: 12px; text-align: center; font-weight: 700; }
.image { background: #4dabf7; width: 220px; }
.head { background: #51cf66; } .data { background: #ffd43b; }
.label { position: fixed; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); border: 1px solid rgba(20,30,40,.18); padding: 6px 8px; font-size: 12px; }
</style>
</head>
<body>
<table><tr><th class="head" colspan="2">infobox title</th></tr><tr><td class="image" rowspan="3">rowspan image</td><td class="data">fact one</td></tr><tr><td class="data">fact two</td></tr><tr><td class="data">fact three</td></tr></table>
<div class="label">78 / 82 - Table Rowspan Infobox</div>
</body>
</html>
