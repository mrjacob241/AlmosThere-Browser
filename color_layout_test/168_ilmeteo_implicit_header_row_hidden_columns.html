<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>168 ilmeteo implicit header row hidden columns</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font: 16px/1.3 Arial, sans-serif; background: #eef2f7; }
    main { width: 1000px; background: #ffffff; padding: 14px; }
    .weather_table { width: 100%; border-collapse: collapse; table-layout: auto; }
    .weather_table th, .weather_table td {
      border: 2px solid #111827;
      padding: 6px 8px;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
    }
    .weather_table th { background: #bae6fd; color: #0f172a; }
    .weather_table td { background: #dcfce7; color: #14532d; }
    .weather_table tr td:nth-child(11), .weather_table tr th:nth-child(11) { display: none; }
    .weather_table tr td:nth-child(12), .weather_table tr th:nth-child(12) { display: none; }
    .weather_table tr td:nth-child(13), .weather_table tr th:nth-child(13) { display: none; }
    .weather_table tr td:nth-child(14), .weather_table tr th:nth-child(14) { display: none; }
  </style>
</head>
<body>
  <main>
    <table class="weather_table summer">
      <thead>
        <th style="width:6%">Ora</div>
        <th style="width:9%">Tempo</div>
        <th style="width:8%">Temp</div>
        <th style="width:18%">Precipitazioni</div>
        <th style="width:5%">Dir</div>
        <th style="width:11%">Vento</div>
        <th style="width:10%">Onde</div>
        <th style="width:9%">UV</div>
        <th style="width:11%">UR%</div>
        <th style="width:9%">Pressione</div>
        <th style="width:9%">Visibilita</div>
        <th style="width:8%">T perc</div>
        <th style="width:8%">Grandine</div>
        <th style="width:9%">Quota</div>
      </thead>
      <tbody>
        <tr>
          <td>18</td><td>Sole</td><td>26</td><td>assenti</td><td>NE</td><td>9/15</td><td>7</td><td>1.9</td><td>53</td><td>1013</td><td>&gt;10km</td><td>26.1</td><td>0%</td><td>4300m</td>
        </tr>
        <tr>
          <td>19</td><td>Sole</td><td>25.2</td><td>assenti</td><td>ENE</td><td>8/13</td><td>7</td><td>0.6</td><td>55</td><td>1013</td><td>&gt;10km</td><td>25.4</td><td>0%</td><td>4300m</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
