<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>169 - Flex Auto Pill Nav Child Min Width</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #f6f7f9; font: 14px/1.35 Arial, sans-serif; color: #1f2933; padding: 28px; }
.header { width: 980px; padding: 18px 24px; background: #ffffff; border: 2px solid #343a40; }
.search { width: 654px; height: 40px; margin-left: 96px; margin-bottom: 12px; background: #d8f5a2; border: 1px solid #82c91e; border-radius: 20px; }
.nav-row { display: flex; align-items: center; width: 820px; margin-left: 96px; background: #e7f5ff; }
.pill-list {
  display: flex;
  flex: 0;
  align-items: center;
  gap: 2px;
  height: 40px;
  margin: 0;
  padding: 4px;
  list-style: none;
  background: #a5d8ff;
  border: 1px solid #339af0;
  border-radius: 9999px;
}
.pill-item { display: flex; flex: 0 1 auto; min-width: 48px; align-items: center; justify-content: center; background: #91a7ff; border-radius: 9999px; }
.pill-link {
  display: flex;
  align-items: center;
  gap: 4px;
  width: 100%;
  min-height: 32px;
  padding: 8px 11px;
  color: #1f2933;
  text-decoration: none;
  background: #ffd43b;
  border-radius: 9999px;
}
.active .pill-link { background: #343a40; color: #ffffff; }
.icon { flex: 0 0 auto; width: 16px; height: 16px; background: #e03131; border-radius: 50%; }
.label { display: inline; white-space: nowrap; background: rgba(255,255,255,.45); }
.more { display: flex; align-items: center; gap: 4px; min-height: 32px; margin-left: 12px; padding: 8px 11px; background: #63e6be; border-radius: 9999px; }
.badge { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.9); border: 1px solid rgba(20,30,40,.2); font-size: 12px; }
</style>
</head>
<body>
<header class="header">
  <div class="search"></div>
  <nav class="nav-row" aria-label="Search menu">
    <ul class="pill-list">
      <li class="pill-item active"><a class="pill-link" href="#"><span class="icon"></span><span class="label">Web</span></a></li>
      <li class="pill-item"><a class="pill-link" href="#"><span class="icon"></span><span class="label">AI Chat</span></a></li>
      <li class="pill-item"><a class="pill-link" href="#"><span class="icon"></span><span class="label">Images</span></a></li>
      <li class="pill-item"><a class="pill-link" href="#"><span class="icon"></span><span class="label">Videos</span></a></li>
      <li class="pill-item"><a class="pill-link" href="#"><span class="icon"></span><span class="label">News</span></a></li>
    </ul>
    <button class="more"><span class="icon"></span><span class="label">More</span></button>
  </nav>
</header>
<div class="badge">169 - flex:auto pill nav keeps child min width</div>
</body>
</html>
