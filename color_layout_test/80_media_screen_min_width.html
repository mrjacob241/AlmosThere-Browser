<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>80 - Media Screen Min Width</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f7f8fa; font-family: system-ui, sans-serif; }
.grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
.box { min-height: 120px; background: #ffd43b; border: 1px solid rgba(20,30,40,.18); display: grid; place-items: center; padding: 10px; font-weight: 700; }
@media screen and (min-width: 700px) { .grid { grid-template-columns: repeat(3, 1fr); } .box { background: #51cf66; } }
.label { position: fixed; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); border: 1px solid rgba(20,30,40,.18); padding: 6px 8px; font-size: 12px; }
</style>
</head>
<body>
<main class="grid"><div class="box">media col 1</div><div class="box">media col 2</div><div class="box">media col 3</div></main>
<div class="label">80 / 82 - Media Screen Min Width</div>
</body>
</html>
