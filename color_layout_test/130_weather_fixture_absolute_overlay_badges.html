<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>130 - Weather Fixture Absolute Overlay Badges</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 28px; background: #f1f3f5; font: 14px/1.35 system-ui, sans-serif; }
.map-card { width: 760px; margin: 0 auto; position: relative; min-height: 390px; background: #91a7ff; border: 1px solid rgba(20,30,40,.22); padding: 18px; }
.map { position: relative; min-height: 310px; background: #51cf66; border: 8px solid #ffd43b; }
.badge { position: absolute; width: 92px; min-height: 42px; display: grid; place-items: center; background: #ff8787; border: 2px solid #17212b; font-weight: 700; }
.b1 { left: 12%; top: 18%; }
.b2 { left: 42%; top: 28%; }
.b3 { right: 10%; bottom: 16%; }
.after { width: 760px; margin: 16px auto 0; min-height: 90px; background: #63e6be; border: 1px solid rgba(20,30,40,.18); padding: 12px; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.9); border: 1px solid rgba(20,30,40,.2); font-size: 12px; }
</style>
</head>
<body>
<section class="map-card">
<div class="map">
<div class="badge b1">TP</div>
<div class="badge b2">PA</div>
<div class="badge b3">CT</div>
</div>
</section>
<div class="after">Absolute weather badges should remain inside the relative map and not affect following flow.</div>
<div class="label">130 - absolute overlay badges</div>
</body>
</html>
