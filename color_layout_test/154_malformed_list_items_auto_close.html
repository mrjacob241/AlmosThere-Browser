<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>151 malformed list items auto close</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f8f9fa; }
    .page { width: 760px; margin: 32px auto; padding: 24px; background: #ffffff; }
    ul { margin: 0; padding: 0; list-style: none; background: #e9ecef; }
    li { display: block; padding: 12px 16px; margin: 0 0 8px; background: #d0bfff; }
    a { color: #1864ab; text-decoration: underline; }
    .badge { display: inline-block; min-width: 72px; padding: 4px 8px; margin-right: 10px; background: #ffd43b; color: #212529; }
  </style>
</head>
<body>
  <main class="page">
    <ul>
      <li><span class="badge">Nord</span><a href="#one">Palermo centro</a>
      <li><span class="badge">Ovest</span><a href="#two">Mondello</a>
      <li><span class="badge">Sud</span><a href="#three">Oreto</a>
    </ul>
  </main>
</body>
</html>
