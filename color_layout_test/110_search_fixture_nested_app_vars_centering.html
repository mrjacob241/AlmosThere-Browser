<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>110 - search fixture Nested App Vars Centering</title>
<style>
:root { --page: #f7f8fa; --line: rgba(20,30,40,.18); --blue: #4dabf7; --green: #51cf66; --pink: #f783ac; --muted: #5c6670; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: var(--page); color: #17212b; }
.box { min-height: 72px; border: 1px solid var(--line); display: grid; place-items: center; padding: 10px; font-size: 13px; font-weight: 700; color: rgba(0,0,0,.74); text-align: center; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.88); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
#app { --page-inline: 1120px; }
.route { --results-inline: 960px; --side-pad: max(24px, calc((100vw - var(--page-inline)) / 2)); padding-inline: var(--side-pad); padding-block-start: 24px; }
.results-shell { max-inline-size: var(--results-inline); margin-inline: auto; display: grid; gap: 16px; }
.search { background: var(--blue); min-height: 88px; }
.result { background: var(--green); min-height: 144px; }
.footer { background: var(--pink); min-height: 72px; }
</style>
</head>
<body>
<div id="app">
  <div class="route">
    <main class="results-shell">
      <section class="box search">nested app and route variables define centered content</section>
      <article class="box result">result body</article>
      <footer class="box footer">footer row</footer>
    </main>
  </div>
</div>
<div class="label">110 - nested app vars centering</div>
</body>
</html>
