<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>24 - Search Fixture Image Results Grid</title>
<style>

:root {
  --ink: #17212b;
  --muted: #5c6670;
  --page: #f7f8fa;
  --line: rgba(20, 30, 40, 0.18);
  --red: #ff6b6b;
  --orange: #f59f00;
  --yellow: #ffd43b;
  --green: #51cf66;
  --teal: #20c997;
  --cyan: #22b8cf;
  --blue: #4dabf7;
  --indigo: #748ffc;
  --violet: #9775fa;
  --pink: #f783ac;
  --gray: #ced4da;
  --dark: #495057;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--page);
}
.box {
  min-height: 48px;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  padding: 10px;
  font-size: 13px;
  font-weight: 700;
  color: rgba(0,0,0,0.74);
  text-align: center;
}
.tall { min-height: 160px; }
.xtall { min-height: 300px; }
.label {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 20;
  padding: 6px 8px;
  background: rgba(255,255,255,0.88);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}


header { height: 72px; background: var(--green); display: grid; grid-template-columns: 170px 1fr 120px; gap: 12px; padding: 12px; }
.logo { background: var(--yellow); } .search { background: white; } .profile { background: var(--blue); }
.tabs { display: grid; grid-template-columns: repeat(6, minmax(80px, 1fr)); gap: 8px; padding: 10px 20px; background: #e8f5ec; }
.tabs .box { background: var(--teal); }
.grid { padding: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { min-height: 150px; background: var(--pink); } .tile:nth-child(3n) { background: var(--orange); } .tile:nth-child(4n) { background: var(--cyan); }
@media (max-width: 700px) { header { grid-template-columns: 1fr 72px; } .logo { display: none; } .tabs { grid-template-columns: repeat(3, 1fr); } }

</style>
</head>
<body>
<header><div class="box logo">brand</div><div class="box search">search</div><div class="box profile">menu</div></header><nav class="tabs"><div class="box">tab 1</div><div class="box">tab 2</div><div class="box">tab 3</div><div class="box">tab 4</div><div class="box">tab 5</div><div class="box">tab 6</div></nav><main class="grid"><section class="box tile">tile 1</section><section class="box tile">tile 2</section><section class="box tile">tile 3</section><section class="box tile">tile 4</section><section class="box tile">tile 5</section><section class="box tile">tile 6</section><section class="box tile">tile 7</section><section class="box tile">tile 8</section><section class="box tile">tile 9</section><section class="box tile">tile 10</section><section class="box tile">tile 11</section><section class="box tile">tile 12</section></main>
<div class="label">24 / 50 - Search Fixture Image Results Grid</div>
</body>
</html>
