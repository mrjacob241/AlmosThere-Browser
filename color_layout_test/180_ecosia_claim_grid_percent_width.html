<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>180. Ecosia Claim Grid Percent Width</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { padding: 32px; font-family: sans-serif; background: #101918; color: white; }
.section { width: 1040px; margin: 0 auto; }
.header { text-align: center; margin-bottom: 40px; }
.eyebrow { min-height: 24px; background: #20c997; margin: 0 auto 12px; width: 180px; }
.title { min-height: 72px; background: #51cf66; margin: 0 auto; width: 440px; }
.claims { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 40px; margin: 0; padding: 0; list-style: none; }
.claim { display: flex; flex-direction: column; gap: 24px; width: 100%; padding: 0; }
.image { width: 100%; height: 25rem; border-radius: 10px; background: #333333; }
.content { width: 100%; min-height: 90px; padding: 8px; background: #748ffc; color: #17212b; font-weight: 700; }
</style>
</head>
<body>
<section class="section">
  <div class="header"><div class="eyebrow"></div><div class="title"></div></div>
  <ol class="claims">
    <li class="claim"><div class="image"></div><div class="content">profits</div></li>
    <li class="claim"><div class="image"></div><div class="content">privacy</div></li>
    <li class="claim"><div class="image"></div><div class="content">ai</div></li>
    <li class="claim"><div class="image"></div><div class="content">neutral</div></li>
  </ol>
</section>
</body>
</html>
