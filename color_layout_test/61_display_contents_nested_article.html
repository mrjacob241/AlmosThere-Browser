<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>61 - Display Contents Nested Article</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f7f8fa; font-family: system-ui, sans-serif; }
.article { display: grid; grid-template-columns: 1fr 280px; gap: 18px; }
.section-wrapper { display: contents; }
.box { min-height: 120px; border: 1px solid rgba(20,30,40,.18); display: grid; place-items: center; padding: 10px; font-weight: 700; }
.lead { background: #51cf66; } .body { background: #4dabf7; } .rail { background: #ffd43b; grid-row: span 2; }
.label { position: fixed; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); border: 1px solid rgba(20,30,40,.18); padding: 6px 8px; font-size: 12px; }
</style>
</head>
<body>
<main class="article"><div class="section-wrapper"><section class="box lead">lead participates in article grid</section><section class="box body">body participates in article grid</section></div><aside class="box rail">right rail</aside></main>
<div class="label">61 / 82 - Display Contents Nested Article</div>
</body>
</html>
