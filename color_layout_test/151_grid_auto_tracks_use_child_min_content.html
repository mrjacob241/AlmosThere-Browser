<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>151 - grid auto tracks use child min content</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f1f3f5; font: 15px/1.35 system-ui, sans-serif; }
.panel { width: 760px; margin: 0 auto; padding: 12px; background: #dee2e6; border: 2px solid #343a40; }
.forecast { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; background: #d3f9d8; padding: 10px; }
.time { background: #ffd43b; padding: 8px; }
.summary { background: #91a7ff; padding: 8px; }
.wind { background: #ff922b; padding: 8px; text-align: center; }
.moon { background: #63e6be; padding: 8px; text-align: center; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.9); border: 1px solid rgba(20,30,40,.2); font-size: 12px; }
</style>
</head>
<body>
<section class="panel">
  <div class="forecast">
    <div class="time">09:00</div>
    <div class="summary">Poco nuvoloso con vento moderato</div>
    <div class="wind">Nord Ovest</div>
    <div class="moon">Gibbosa calante</div>
  </div>
</section>
<div class="label">151 - grid auto tracks use child min-content</div>
</body>
</html>
