<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>71 - Length Clamp Columns</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f7f8fa; font-family: system-ui, sans-serif; }
.grid { display: grid; grid-template-columns: clamp(180px, 25vw, 280px) 1fr clamp(160px, 20vw, 240px); gap: 16px; }
.box { min-height: 160px; border: 1px solid rgba(20,30,40,.18); display: grid; place-items: center; padding: 10px; font-weight: 700; }
.a { background: #ffd43b; } .b { background: #51cf66; } .c { background: #4dabf7; }
.label { position: fixed; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); border: 1px solid rgba(20,30,40,.18); padding: 6px 8px; font-size: 12px; }
</style>
</head>
<body>
<main class="grid"><aside class="box a">clamped left</aside><section class="box b">fluid center</section><aside class="box c">clamped right</aside></main>
<div class="label">71 / 82 - Length Clamp Columns</div>
</body>
</html>
