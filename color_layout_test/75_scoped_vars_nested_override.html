<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>75 - Scoped Vars Nested Override</title>
<style>
* { box-sizing: border-box; }
body { --tone: #ffd43b; margin: 0; padding: 24px; background: #f7f8fa; font-family: system-ui, sans-serif; }
.outer { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card { --tone: #51cf66; min-height: 140px; background: var(--tone); border: 1px solid rgba(20,30,40,.18); display: grid; place-items: center; padding: 10px; font-weight: 700; }
.card.alt { --tone: #4dabf7; }
.child { background: var(--tone); border: 6px solid rgba(0,0,0,.18); min-height: 80px; display: grid; place-items: center; }
.label { position: fixed; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); border: 1px solid rgba(20,30,40,.18); padding: 6px 8px; font-size: 12px; }
</style>
</head>
<body>
<main class="outer"><section class="card"><div class="child">inherits green var</div></section><section class="card alt"><div class="child">inherits blue override</div></section></main>
<div class="label">75 / 82 - Scoped Vars Nested Override</div>
</body>
</html>
