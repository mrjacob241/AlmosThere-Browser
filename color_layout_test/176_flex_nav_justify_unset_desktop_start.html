<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>176 - flex nav justify unset desktop start</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: system-ui, sans-serif; background: #f7f8fa; padding: 24px; color: #17212b; }
.shell { width: 920px; min-height: 160px; background: #e7f5ff; border: 2px solid #339af0; padding: 16px; }
.nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 64px;
  background: #ffd43b;
  padding: 8px;
}
@media only screen and (min-width: 67.5rem) {
  .nav { justify-content: unset; }
}
.tabs {
  display: flex;
  flex: 0 1 auto;
  gap: 2px;
  height: 40px;
  margin: 0;
  padding: 4px;
  list-style: none;
  background: #51cf66;
  border: 1px solid rgba(20,30,40,.18);
  border-radius: 9999px;
}
.tabs li { display: flex; min-width: 48px; align-items: center; justify-content: center; background: #d0bfff; border-radius: 9999px; }
.tabs a { display: flex; align-items: center; gap: 4px; width: 100%; padding: 8px 11px; color: inherit; text-decoration: none; }
.icon { flex: 0 0 auto; width: 16px; height: 16px; background: #ff6b6b; border-radius: 50%; }
.spacer { width: 180px; height: 40px; background: #20c997; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.9); border: 1px solid rgba(20,30,40,.18); font-size: 12px; color: #5c6670; }
</style>
</head>
<body>
<main class="shell">
  <div class="nav">
    <ul class="tabs">
      <li><a href="#"><span class="icon"></span><span>Web</span></a></li>
      <li><a href="#"><span class="icon"></span><span>Images</span></a></li>
      <li><a href="#"><span class="icon"></span><span>Videos</span></a></li>
    </ul>
    <div class="spacer"></div>
  </div>
</main>
<div class="label">176 - desktop justify-content unset resets to start</div>
</body>
</html>
