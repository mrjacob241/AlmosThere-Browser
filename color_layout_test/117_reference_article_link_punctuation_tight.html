<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>117 - reference article Link Punctuation Tight</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 28px; background: #f8f9fa; color: #202122; font: 16px/1.55 Georgia, "Times New Roman", serif; }
.page { width: 940px; margin: 0 auto; padding: 28px 34px; background: #fff; border: 1px solid #a2a9b1; }
.line { background: #e7f5ff; padding: 12px 14px; margin: 0 0 12px; }
a { color: #0645ad; background: #74c0fc; text-decoration: underline; padding: 0; margin: 0; }
.punct { background: #ff8787; color: #202122; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.9); border: 1px solid #a2a9b1; font: 12px/1.2 system-ui, sans-serif; }
</style>
</head>
<body>
<main class="page">
<p class="line">Tight comma: <a href="#">algoritmi</a><span class="punct">,</span> <a href="#">codice sorgente</a><span class="punct">.</span></p>
<p class="line">Tight parentheses: (<a href="#">linguaggio</a><span class="punct">)</span> and [<a href="#">software</a><span class="punct">]</span>.</p>
<p class="line">Tight colon and semicolon: <a href="#">computer</a><span class="punct">:</span> <a href="#">programma</a><span class="punct">;</span> final text.</p>
</main>
<div class="label">117 - link punctuation tight</div>
</body>
</html>
