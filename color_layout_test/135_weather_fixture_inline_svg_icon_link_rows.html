<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>135 - Weather Fixture Inline SVG Icon Link Rows</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 28px; background: #f8f9fa; font: 15px/1.35 system-ui, sans-serif; }
.panel { width: 760px; margin: 0 auto; background: #74c0fc; padding: 14px; border: 1px solid rgba(20,30,40,.2); }
ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
li { min-width: 0; background: #fff3bf; border: 1px solid rgba(20,30,40,.16); }
a { display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 8px 10px; background: #d0bfff; color: #17212b; text-decoration: none; }
img { flex: 0 0 auto; width: 24px; height: 24px; display: block; background: #51cf66; border: 3px solid #ff8787; }
.text { min-width: 0; background: #ffd43b; padding: 3px 6px; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.9); border: 1px solid rgba(20,30,40,.2); font-size: 12px; }
</style>
</head>
<body>
<nav class="panel">
<ul>
<li><a href="#"><img src="palermo.svg" alt=""><span class="text">Palermo</span></a></li>
<li><a href="#"><img src="messina.svg" alt=""><span class="text">Messina provincia</span></a></li>
<li><a href="#"><img src="catania.svg" alt=""><span class="text">Catania</span></a></li>
<li><a href="#"><img src="trapani.svg" alt=""><span class="text">Trapani e isole</span></a></li>
</ul>
</nav>
<div class="label">135 - inline svg icon link rows</div>
</body>
</html>
