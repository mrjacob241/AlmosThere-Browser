<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>77 - Table Colspan Layout</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f7f8fa; font-family: system-ui, sans-serif; }
table { width: 900px; border-collapse: collapse; table-layout: auto; }
td, th { border: 2px solid rgba(20,30,40,.25); height: 72px; text-align: center; font-weight: 700; }
th { background: #51cf66; } .a { background: #ffd43b; } .b { background: #4dabf7; } .c { background: #f783ac; }
.label { position: fixed; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); border: 1px solid rgba(20,30,40,.18); padding: 6px 8px; font-size: 12px; }
</style>
</head>
<body>
<table><tr><th colspan="3">wide colspan header</th></tr><tr><td class="a">one</td><td class="b">two</td><td class="c">three</td></tr></table>
<div class="label">77 / 82 - Table Colspan Layout</div>
</body>
</html>
