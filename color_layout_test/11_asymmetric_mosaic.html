<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>11 - Asymmetric Mosaic</title>
<style>

:root {
  --ink: #17212b;
  --muted: #5c6670;
  --page: #f7f8fa;
  --line: rgba(20, 30, 40, 0.18);
  --red: #ff6b6b;
  --orange: #f59f00;
  --yellow: #ffd43b;
  --green: #51cf66;
  --teal: #20c997;
  --cyan: #22b8cf;
  --blue: #4dabf7;
  --indigo: #748ffc;
  --violet: #9775fa;
  --pink: #f783ac;
  --gray: #ced4da;
  --dark: #495057;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--page);
}
.box {
  min-height: 48px;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  padding: 10px;
  font-size: 13px;
  font-weight: 700;
  color: rgba(0,0,0,0.74);
  text-align: center;
}
.tall { min-height: 160px; }
.xtall { min-height: 300px; }
.label {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 20;
  padding: 6px 8px;
  background: rgba(255,255,255,0.88);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}


.page { padding: 20px; display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 96px; gap: 10px; }
.a { grid-column: span 3; grid-row: span 2; background: var(--red); } .b { grid-column: span 2; background: var(--green); } .c { background: var(--yellow); }
.d { grid-column: span 2; grid-row: span 2; background: var(--blue); } .e { grid-column: span 3; background: var(--pink); } .f { grid-column: span 1; background: var(--teal); }
@media (max-width: 760px) { .page { grid-template-columns: 1fr; grid-auto-rows: 90px; } .box { grid-column: auto !important; grid-row: auto !important; } }

</style>
</head>
<body>
<main class="page"><section class="box a">A span</section><section class="box b">B</section><section class="box c">C</section><section class="box d">D span</section><section class="box e">E</section><section class="box f">F</section></main>
<div class="label">11 / 50 - Asymmetric Mosaic</div>
</body>
</html>
