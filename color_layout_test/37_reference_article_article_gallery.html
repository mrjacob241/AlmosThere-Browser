<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>37 - reference article Article Gallery</title>
<style>

:root {
  --ink: #17212b;
  --muted: #5c6670;
  --page: #f7f8fa;
  --line: rgba(20, 30, 40, 0.18);
  --red: #ff6b6b;
  --orange: #f59f00;
  --yellow: #ffd43b;
  --green: #51cf66;
  --teal: #20c997;
  --cyan: #22b8cf;
  --blue: #4dabf7;
  --indigo: #748ffc;
  --violet: #9775fa;
  --pink: #f783ac;
  --gray: #ced4da;
  --dark: #495057;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--page);
}
.box {
  min-height: 48px;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  padding: 10px;
  font-size: 13px;
  font-weight: 700;
  color: rgba(0,0,0,0.74);
  text-align: center;
}
.tall { min-height: 160px; }
.xtall { min-height: 300px; }
.label {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 20;
  padding: 6px 8px;
  background: rgba(255,255,255,0.88);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}


.shell { min-height: 100vh; display: grid; grid-template-columns: 176px 1fr; }
.sidebar { background: var(--gray); }
.content { display: grid; grid-template-rows: 64px auto 1fr; }
.top { background: var(--blue); } .heading { background: var(--yellow); min-height: 90px; }
.gallery { padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.gallery .box { min-height: 140px; background: var(--teal); } .gallery .box:nth-child(odd) { background: var(--pink); }
@media (max-width: 820px) { .shell { grid-template-columns: 1fr; } .sidebar { min-height: 64px; } }

</style>
</head>
<body>
<div class="shell"><aside class="box sidebar">left nav</aside><main class="content"><header class="box top">page tabs</header><section class="box heading">heading</section><section class="gallery"><div class="box">item 1</div><div class="box">item 2</div><div class="box">item 3</div><div class="box">item 4</div><div class="box">item 5</div><div class="box">item 6</div><div class="box">item 7</div><div class="box">item 8</div><div class="box">item 9</div><div class="box">item 10</div><div class="box">item 11</div><div class="box">item 12</div></section></main></div>
<div class="label">37 / 50 - reference article Article Gallery</div>
</body>
</html>
