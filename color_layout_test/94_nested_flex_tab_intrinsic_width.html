<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>94 - Nested Flex Tab Intrinsic Width</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #f6f7f9; font-family: Arial, sans-serif; color: #1f2933; }
.header { width: 920px; margin: 28px; padding: 20px; background: #343a40; }
.menu {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 720px;
  margin: 0;
  padding: 0;
  background: #e7f5ff;
}
.menu-item { display: flex; height: 44px; background: #91a7ff; }
.tab {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: #ffd43b;
  color: #1f2933;
  text-decoration: none;
}
.icon { width: 16px; height: 16px; background: #e03131; flex: 0 0 auto; }
.divider { width: 1px; height: 32px; background: #495057; }
.chat { display: flex; height: 44px; background: #63e6be; }
.label {
  position: fixed;
  right: 12px;
  bottom: 12px;
  padding: 6px 8px;
  background: #fff;
  border: 1px solid #c8c8c8;
  font-size: 12px;
}
</style>
</head>
<body>
<header class="header">
  <ul class="menu">
    <li class="menu-item"><a class="tab" href="#"><span class="icon"></span><span>Images</span></a></li>
    <li class="menu-item"><a class="tab" href="#"><span class="icon"></span><span>Videos</span></a></li>
    <li class="menu-item"><a class="tab" href="#"><span class="icon"></span><span>Maps</span></a></li>
    <li class="menu-item"><button class="tab"><span class="icon"></span><span>More</span></button></li>
    <div class="divider"></div>
    <div class="chat"><a class="tab" href="#"><span class="icon"></span><span>AI Chat</span></a></div>
  </ul>
</header>
<div class="label">94 / regression - nested flex tab intrinsic width</div>
</body>
</html>
