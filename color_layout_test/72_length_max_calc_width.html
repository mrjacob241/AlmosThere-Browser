<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>72 - Length Max Calc Width</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f7f8fa; font-family: system-ui, sans-serif; }
.outer { width: 840px; border: 1px solid rgba(20,30,40,.18); padding: 16px; background: #fff; }
.box { width: max(320px, calc(100% - 260px)); min-height: 140px; background: #51cf66; border: 1px solid rgba(20,30,40,.18); display: grid; place-items: center; font-weight: 700; }
.side { width: 240px; min-height: 80px; margin-top: 16px; background: #ffd43b; display: grid; place-items: center; font-weight: 700; }
.label { position: fixed; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); border: 1px solid rgba(20,30,40,.18); padding: 6px 8px; font-size: 12px; }
</style>
</head>
<body>
<main class="outer"><section class="box">max(calc()) main width</section><aside class="side">control width</aside></main>
<div class="label">72 / 82 - Length Max Calc Width</div>
</body>
</html>
