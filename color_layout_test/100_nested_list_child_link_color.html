<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 - Nested List Child Link Color</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #f4f6f8; font-family: Arial, sans-serif; color: #17212b; }
.shell { width: 640px; margin: 32px; padding: 24px; background: #fff; border: 1px solid #ced4da; }
.nav {
  width: 540px;
  margin: 0;
  padding-left: 40px;
  background: #e7f5ff;
}
.nav li {
  display: list-item;
  margin: 0;
  padding: 0;
  color: #17212b;
}
.nav a {
  display: inline;
  color: #a80000;
  text-decoration: underline;
}
.nav ul {
  margin: 8px 0 12px;
  padding-left: 40px;
  background: #d3f9d8;
}
.label {
  position: fixed;
  right: 12px;
  bottom: 12px;
  padding: 6px 8px;
  background: #fff;
  border: 1px solid #c8c8c8;
  font-size: 12px;
}
</style>
</head>
<body>
<main class="shell">
  <ul class="nav">
    <li>
      <a href="#text">Text</a>
      <ul>
        <li><a href="#headings">Headings</a></li>
        <li><a href="#paragraphs">Paragraphs</a></li>
        <li><a href="#blockquotes">Blockquotes</a></li>
      </ul>
    </li>
    <li><a href="#forms">Forms</a></li>
  </ul>
</main>
<div class="label">100 / regression - nested list links stay colored and indented</div>
</body>
</html>
