<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>124 - weather fixture Picture Source Fallback Logo</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 28px; background: #f1f3f5; color: #17212b; font: 15px/1.4 system-ui, sans-serif; }
.header { width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: #74c0fc; border: 1px solid rgba(20,30,40,.2); }
.logo-link { display: flex; align-items: center; justify-content: center; width: 190px; min-height: 58px; background: #ffe066; border: 1px solid rgba(20,30,40,.2); }
picture { display: inline-block; width: 160px; height: 44px; background: #ff8787; }
img.logo { display: block; width: 160px; height: 44px; background: #51cf66; border: 0; }
.search { flex: 1 1 auto; min-width: 0; height: 44px; background: #d0bfff; border: 1px solid rgba(20,30,40,.2); }
.button { width: 96px; height: 44px; background: #63e6be; border: 1px solid rgba(20,30,40,.2); }
.below { width: 1040px; margin: 16px auto 0; min-height: 160px; background: #fff3bf; border: 1px solid rgba(20,30,40,.2); padding: 14px; }
.label { position: fixed; right: 12px; bottom: 12px; padding: 6px 8px; background: rgba(255,255,255,.9); border: 1px solid rgba(20,30,40,.2); font-size: 12px; }
</style>
</head>
<body>
<header class="header">
<a class="logo-link" href="#">
<picture>
<source media="(min-width:768px)" srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" type="image/gif">
<img class="logo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="site logo">
</picture>
</a>
<div class="search"></div>
<div class="button"></div>
</header>
<main class="below">Header logo should reserve one stable colored logo block; it should not duplicate, collapse, or push the search field.</main>
<div class="label">124 - picture source fallback logo</div>
</body>
</html>
