<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>50 - reference article Article Full Complex</title>
<style>

:root {
  --ink: #17212b;
  --muted: #5c6670;
  --page: #f7f8fa;
  --line: rgba(20, 30, 40, 0.18);
  --red: #ff6b6b;
  --orange: #f59f00;
  --yellow: #ffd43b;
  --green: #51cf66;
  --teal: #20c997;
  --cyan: #22b8cf;
  --blue: #4dabf7;
  --indigo: #748ffc;
  --violet: #9775fa;
  --pink: #f783ac;
  --gray: #ced4da;
  --dark: #495057;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--page);
}
.box {
  min-height: 48px;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  padding: 10px;
  font-size: 13px;
  font-weight: 700;
  color: rgba(0,0,0,0.74);
  text-align: center;
}
.tall { min-height: 160px; }
.xtall { min-height: 300px; }
.label {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 20;
  padding: 6px 8px;
  background: rgba(255,255,255,0.88);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}


.page { min-height: 100vh; display: grid; grid-template: "left top top" 56px "left title right" auto "left body right" 1fr "left foot foot" 86px / 176px minmax(0, 860px) 300px; }
.left { grid-area: left; background: var(--gray); } .top { grid-area: top; background: var(--blue); }
.title { grid-area: title; background: var(--yellow); min-height: 110px; } .right { grid-area: right; background: var(--orange); }
.body { grid-area: body; padding: 16px; display: grid; gap: 14px; } .body .box { background: var(--green); min-height: 130px; }
.foot { grid-area: foot; background: var(--teal); }
@media (max-width: 1000px) { .page { grid-template: "top" 56px "title" auto "right" 180px "body" 1fr "foot" 80px / 1fr; } .left { display:none; } }

</style>
</head>
<body>
<div class="page"><aside class="box left">left navigation</aside><header class="box top">top actions</header><section class="box title">article heading and tabs</section><aside class="box right">infobox / toc</aside><main class="body"><section class="box">article section 1</section><section class="box">article section 2</section><section class="box">article section 3</section><section class="box">article section 4</section><section class="box">article section 5</section><section class="box">article section 6</section></main><footer class="box foot">footer links</footer></div>
<div class="label">50 / 50 - reference article Article Full Complex</div>
</body>
</html>
