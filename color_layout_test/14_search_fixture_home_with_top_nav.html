<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>14 - search fixture Home With Top Nav</title>
<style>

:root {
  --ink: #17212b;
  --muted: #5c6670;
  --page: #f7f8fa;
  --line: rgba(20, 30, 40, 0.18);
  --red: #ff6b6b;
  --orange: #f59f00;
  --yellow: #ffd43b;
  --green: #51cf66;
  --teal: #20c997;
  --cyan: #22b8cf;
  --blue: #4dabf7;
  --indigo: #748ffc;
  --violet: #9775fa;
  --pink: #f783ac;
  --gray: #ced4da;
  --dark: #495057;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--page);
}
.box {
  min-height: 48px;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  padding: 10px;
  font-size: 13px;
  font-weight: 700;
  color: rgba(0,0,0,0.74);
  text-align: center;
}
.tall { min-height: 160px; }
.xtall { min-height: 300px; }
.label {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 20;
  padding: 6px 8px;
  background: rgba(255,255,255,0.88);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}


.page { min-height: 100vh; display: grid; grid-template-rows: 64px 1fr 88px; }
nav { background: var(--blue); display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; padding: 10px 18px; }
.logo { background: var(--green); min-width: 130px; } .navitem { background: var(--yellow); min-width: 76px; }
main { display: grid; place-items: center; padding: 24px; background: #edf7f0; }
.search { width: min(720px, 94vw); display: grid; grid-template-columns: 1fr 72px; gap: 8px; }
.input { background: white; min-height: 56px; } .button { background: var(--green); min-height: 56px; }
footer { background: var(--gray); display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; }
footer .box { background: var(--cyan); }
@media (max-width: 640px) { .search { grid-template-columns: 1fr; } nav, footer { grid-template-columns: 1fr 1fr; } }

</style>
</head>
<body>
<div class="page"><nav><div class="box logo">logo</div><div class="box navitem">nav</div><div class="box navitem">nav</div><div class="box navitem">menu</div></nav><main><form class="search"><div class="box input">search input</div><div class="box button">button</div></form></main><footer><div class="box">footer 1</div><div class="box">footer 2</div><div class="box">footer 3</div><div class="box">footer 4</div></footer></div>
<div class="label">14 / 50 - search fixture Home With Top Nav</div>
</body>
</html>
