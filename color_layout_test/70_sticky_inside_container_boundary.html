<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>70 - Sticky Inside Container Boundary</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f7f8fa; font-family: system-ui, sans-serif; }
.spacer { height: 120px; background: #ced4da; display: grid; place-items: center; font-weight: 700; }
.container { height: 520px; border: 4px solid #4dabf7; padding: 12px; background: #e7f5ff; }
.sticky { position: sticky; top: 16px; height: 80px; background: #51cf66; display: grid; place-items: center; font-weight: 700; }
.tail { height: 620px; background: #ffd43b; padding: 16px; }
.label { position: fixed; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); border: 1px solid rgba(20,30,40,.18); padding: 6px 8px; font-size: 12px; }
</style>
</head>
<body>
<div class="spacer">before container</div><section class="container"><div class="sticky">sticky constrained by container</div><div class="tail">container content</div></section>
<div class="label">70 / 82 - Sticky Inside Container Boundary</div>
</body>
</html>
